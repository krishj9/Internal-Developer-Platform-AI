[project]
name = "idp-platform"
version = "2.1.0"
description = "Internal Developer Platform (IDP) for Governed Agentic-AI on GCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-storage>=2.18.0",
    "httpx>=0.28.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "cli*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["api/tests", "templates", "cli/tests", "examples/workloads/math-agent/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # Allow FastAPI Depends() in argument defaults

[tool.ruff.lint.isort]
known-first-party = ["api", "app"]


