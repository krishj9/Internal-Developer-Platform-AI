name: "Deploy T1 Agent Engine"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Correlation ID for request"
        required: true
      deployment_id:
        description: "Unique deployment ID"
        required: true
      template_id:
        description: "Template ID (must be t1-agent-engine)"
        required: true
        default: "t1-agent-engine"
      template_version:
        description: "Template semantic version"
        required: true
        default: "2.0.0"
      template_commit_sha:
        description: "Immutable commit SHA to checkout"
        required: true
      operation:
        description: "Lifecycle operation: 'create' or 'destroy'"
        required: true
        default: "create"
      workspace:
        description: "Target workspace identifier"
        required: true
        default: "ws-dev"
      environment:
        description: "Target environment"
        required: true
        default: "dev"
      inputs_json:
        description: "Validated template inputs JSON"
        required: false
        default: "{}"
      callback_url:
        description: "FastAPI Control Plane callback URL"
        required: true
      workload_identity_provider:
        description: "WIF Provider full name"
        required: true
      service_account:
        description: "Pipeline Service Account email"
        required: true
      state_bucket:
        description: "GCS bucket for remote state"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Immutable Template Release
        uses: actions/checkout@v4
        continue-on-error: true
        id: primary_checkout
        with:
          ref: ${{ (github.event.inputs.template_commit_sha != '' && github.event.inputs.template_commit_sha != '010078cf6745f44da605f6fa0768b4f177c385a5' && github.event.inputs.template_commit_sha != '55e69c7b9da54a49ef8b0f49c061fe7dbdb98998') && github.event.inputs.template_commit_sha || 'main' }}

      - name: Fallback Checkout main
        if: steps.primary_checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to GCP via WIF
        id: gcp_auth
        uses: ./.github/actions/authenticate-gcp-wif
        with:
          workload_identity_provider: ${{ github.event.inputs.workload_identity_provider }}
          service_account: ${{ github.event.inputs.service_account }}
          id_token_audience: ${{ github.event.inputs.callback_url }}

      - name: Post PLANNING Callback
        uses: ./.github/actions/post-pipeline-callback
        with:
          callback_url: ${{ github.event.inputs.callback_url }}
          id_token: ${{ steps.gcp_auth.outputs.id_token }}
          state_bucket: ${{ github.event.inputs.state_bucket }}
          request_id: ${{ github.event.inputs.request_id }}
          github_run_id: ${{ github.run_id }}
          event_sequence: "1"
          payload_json: |
            {
              "request_id": "${{ github.event.inputs.request_id }}",
              "deployment_id": "${{ github.event.inputs.deployment_id }}",
              "template_id": "${{ github.event.inputs.template_id }}",
              "template_version": "${{ github.event.inputs.template_version }}",
              "template_commit_sha": "${{ github.event.inputs.template_commit_sha }}",
              "repository": "${{ github.repository }}",
              "workflow": "deploy-t1.yml",
              "github_run_id": "${{ github.run_id }}",
              "event_sequence": 1,
              "operation": "${{ github.event.inputs.operation }}",
              "status": "PLANNING",
              "summary": "Terraform planning stage completed.",
              "artifact_references": []
            }

  apply:
    name: Terraform Apply & Readiness Gate
    needs: [plan]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Immutable Template Release
        uses: actions/checkout@v4
        continue-on-error: true
        id: primary_checkout
        with:
          ref: ${{ (github.event.inputs.template_commit_sha != '' && github.event.inputs.template_commit_sha != '010078cf6745f44da605f6fa0768b4f177c385a5' && github.event.inputs.template_commit_sha != '55e69c7b9da54a49ef8b0f49c061fe7dbdb98998') && github.event.inputs.template_commit_sha || 'main' }}

      - name: Fallback Checkout main
        if: steps.primary_checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to GCP via WIF
        id: gcp_auth
        uses: ./.github/actions/authenticate-gcp-wif
        with:
          workload_identity_provider: ${{ github.event.inputs.workload_identity_provider }}
          service_account: ${{ github.event.inputs.service_account }}
          id_token_audience: ${{ github.event.inputs.callback_url }}

      - name: Post APPLYING Callback
        uses: ./.github/actions/post-pipeline-callback
        with:
          callback_url: ${{ github.event.inputs.callback_url }}
          id_token: ${{ steps.gcp_auth.outputs.id_token }}
          state_bucket: ${{ github.event.inputs.state_bucket }}
          request_id: ${{ github.event.inputs.request_id }}
          github_run_id: ${{ github.run_id }}
          event_sequence: "2"
          payload_json: |
            {
              "request_id": "${{ github.event.inputs.request_id }}",
              "deployment_id": "${{ github.event.inputs.deployment_id }}",
              "template_id": "${{ github.event.inputs.template_id }}",
              "template_version": "${{ github.event.inputs.template_version }}",
              "template_commit_sha": "${{ github.event.inputs.template_commit_sha }}",
              "repository": "${{ github.repository }}",
              "workflow": "deploy-t1.yml",
              "github_run_id": "${{ github.run_id }}",
              "event_sequence": 2,
              "operation": "${{ github.event.inputs.operation }}",
              "status": "APPLYING",
              "summary": "Terraform apply / infrastructure provisioning in progress.",
              "artifact_references": []
            }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Destroy Vertex AI Reasoning Engine (Destroy Only)
        if: github.event.inputs.operation == 'destroy'
        shell: bash
        run: |
          python3 -m pip install -r templates/t1-agent-engine/agent/requirements.txt || true
          python3 templates/t1-agent-engine/scripts/manage_reasoning_engine.py \
            --operation destroy \
            --deployment-id "${{ github.event.inputs.deployment_id }}" \
            --project-id "mybrightday-dev" \
            --region "us-central1" || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Execute Terraform Lifecycle
        id: terraform
        uses: ./.github/actions/terraform-lifecycle
        with:
          working_directory: "templates/t1-agent-engine/terraform"
          state_bucket: ${{ github.event.inputs.state_bucket }}
          state_key: "templates/t1-agent-engine/${{ github.event.inputs.deployment_id }}/terraform.tfstate"
          operation: ${{ github.event.inputs.operation == 'destroy' && 'destroy' || 'apply' }}
          var_file_content: ${{ github.event.inputs.inputs_json }}

      - name: Deploy Vertex AI Reasoning Engine (Create Only)
        id: deploy_engine
        if: github.event.inputs.operation == 'create'
        shell: bash
        run: |
          python3 -m pip install -r templates/t1-agent-engine/agent/requirements.txt || true
          STAGING_BUCKET=$(echo '${{ steps.terraform.outputs.raw_outputs_json }}' | jq -r '.staging_bucket.value // ""')
          RUNTIME_SA=$(echo '${{ steps.terraform.outputs.raw_outputs_json }}' | jq -r '.runtime_sa_email.value // ""')
          TOOL_SECRET=$(echo '${{ steps.terraform.outputs.raw_outputs_json }}' | jq -r '.tool_secret_id.value // ""')
          ALERT_POLICY=$(echo '${{ steps.terraform.outputs.raw_outputs_json }}' | jq -r '.alert_policy_id.value // ""')
          MODEL_NAME=$(echo '${{ github.event.inputs.inputs_json }}' | jq -r '.model_name // "gemini-2.5-flash"')

          python3 templates/t1-agent-engine/scripts/manage_reasoning_engine.py \
            --operation create \
            --deployment-id "${{ github.event.inputs.deployment_id }}" \
            --project-id "mybrightday-dev" \
            --region "us-central1" \
            --staging-bucket "${STAGING_BUCKET}" \
            --model-name "${MODEL_NAME}" \
            --output-json /tmp/engine_output.json

          RESOURCE_ID=$(jq -r '.agent_engine_resource_id // ""' /tmp/engine_output.json)
          echo "resource_id=${RESOURCE_ID}" >> $GITHUB_OUTPUT
          echo "staging_bucket=${STAGING_BUCKET}" >> $GITHUB_OUTPUT
          echo "runtime_sa_email=${RUNTIME_SA}" >> $GITHUB_OUTPUT
          echo "tool_secret_id=${TOOL_SECRET}" >> $GITHUB_OUTPUT
          echo "alert_policy_id=${ALERT_POLICY}" >> $GITHUB_OUTPUT
          echo "model_name=${MODEL_NAME}" >> $GITHUB_OUTPUT

      - name: Run Readiness Test (Create Only)
        if: github.event.inputs.operation == 'create'
        uses: ./.github/actions/run-readiness-test
        env:
          REASONING_ENGINE_RESOURCE_ID: ${{ steps.deploy_engine.outputs.resource_id }}
        with:
          smoke_test_script: "templates/t1-agent-engine/agent/smoke_test.py"
          working_directory: "templates/t1-agent-engine"

      - name: Post SUCCEEDED Callback
        if: success()
        uses: ./.github/actions/post-pipeline-callback
        with:
          callback_url: ${{ github.event.inputs.callback_url }}
          id_token: ${{ steps.gcp_auth.outputs.id_token }}
          state_bucket: ${{ github.event.inputs.state_bucket }}
          request_id: ${{ github.event.inputs.request_id }}
          github_run_id: ${{ github.run_id }}
          event_sequence: "3"
          payload_json: |
            {
              "request_id": "${{ github.event.inputs.request_id }}",
              "deployment_id": "${{ github.event.inputs.deployment_id }}",
              "template_id": "${{ github.event.inputs.template_id }}",
              "template_version": "${{ github.event.inputs.template_version }}",
              "template_commit_sha": "${{ github.event.inputs.template_commit_sha }}",
              "repository": "${{ github.repository }}",
              "workflow": "deploy-t1.yml",
              "github_run_id": "${{ github.run_id }}",
              "event_sequence": 3,
              "operation": "${{ github.event.inputs.operation }}",
              "status": "SUCCEEDED",
              "summary": "Lifecycle ${{ github.event.inputs.operation }} completed successfully.",
              "artifact_references": [],
              "outputs": {
                "deployment_id": "${{ github.event.inputs.deployment_id }}",
                "agent_engine_resource_id": "${{ steps.deploy_engine.outputs.resource_id }}",
                "staging_bucket": "${{ steps.deploy_engine.outputs.staging_bucket }}",
                "runtime_sa_email": "${{ steps.deploy_engine.outputs.runtime_sa_email }}",
                "tool_secret_id": "${{ steps.deploy_engine.outputs.tool_secret_id }}",
                "alert_policy_id": "${{ steps.deploy_engine.outputs.alert_policy_id }}",
                "model_name": "${{ steps.deploy_engine.outputs.model_name || 'gemini-2.5-flash' }}",
                "region": "us-central1",
                "status": "ACTIVE"
              }
            }
